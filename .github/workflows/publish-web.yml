name: Publish playable web build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot Web export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /root/.local/share/godot/export_templates/4.4.stable/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"
      - name: Import project
        run: godot --headless --editor --quit --path .
      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
